<!DOCTYPE html>
<html lang="en">
<head>
    
<style>
    .food-container{
        background-color: wheat;
        padding: 10px;
        grid-template-columns: 1fr 1fr 1fr;
        display: grid;
        gap: 20px;
    }
.food-container div{
    border: 2px solid black;
    padding: 10px;
    text-align: center;
    font-size: 15px;

}
.food-container img{
    width: 100%;
    height: 250px;
    object-fit: cover;
}
.food-box h2{
    margin: 5px;
}
button{
    background-color: beige;
    color: whitesmoke;


}

    </style>
</head>
<body>
    <div class="food-container">
        <div class="food-box">
            <img src="pizza.jpg">
           <h2>Pizza</h2>
           <p>₹ 120</p>
            <button style="background-color: blueviolet;">ORDER NOW</button>

           </div>


        <div class="food-box">
        <img src="burger.jpg">
        <h2>burger</h2>
        <p>₹100</p>
         <button style="background-color: blueviolet;">ORDER NOW</button> 


        </div>
    
        <div class="food-box">
        <img src="briyani.jpg">

        <p>₹140</p>
         <button style="background-color: blueviolet;">ORDER NOW</button>


        </div>


        <div class="food-box">
        <img src="samosa.jpg">
        <h2>samosa</h2>
        <p>₹15</p>
         <button style="background-color: blueviolet;">ORDER NOW</button>


        </div>


        <div class="food-box">

        <h2>puff</h2>

            <h2>momos</h2>
            <p>₹100</p>
             <button style="background-color: blueviolet;">ORDER NOW</button>



          </div>
    
</body>
</html>
